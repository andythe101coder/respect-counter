
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respect Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #111;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      font-family: Arial, Helvetica, sans-serif;
    }

    #counter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: clamp(4rem, 16vw, 10rem);
      font-weight: 800;
      text-align: center;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.85);
      user-select: none;
      pointer-events: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main id="counter" aria-live="polite">Loading...</main>

  <script>
    // PASTE YOUR ACTUAL SUPABASE VALUES HERE.
    const SUPABASE_URL = "https://igdsysiqnmkwfqhyfouu.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_L69GAD0r66l20nhoNiH1lA_le4PiO2C";

    const counterElement = document.getElementById("counter");

    async function startApp() {
      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      // One vote identity per browser tab session.
      let visitId = sessionStorage.getItem("respect_visit_id");

      if (!visitId) {
        visitId = crypto.randomUUID();
        sessionStorage.setItem("respect_visit_id", visitId);
      }

      function showTotal(total) {
        counterElement.textContent =
          Number(total).toLocaleString();
      }

      function applyBackground(url) {
        if (!url) {
          document.body.style.backgroundImage = "none";
          return;
        }

        try {
          const parsed = new URL(url);

          if (parsed.protocol !== "https:") return;

          document.body.style.backgroundImage =
            `url("${parsed.href.replace(/["\\()]/g, "\\$&")}")`;
        } catch (error) {
          console.error("Invalid background URL:", error);
        }
      }

      async function loadCurrentState() {
        const [counterResult, settingsResult] = await Promise.all([
          db.from("counter_state")
            .select("respect")
            .eq("id", 1)
            .single(),

          db.from("site_settings")
            .select("background_url")
            .eq("id", 1)
            .single()
        ]);

        if (counterResult.error) throw counterResult.error;
        if (settingsResult.error) throw settingsResult.error;

        showTotal(counterResult.data.respect);
        applyBackground(settingsResult.data.background_url);
      }

      async function castVote(value) {
        const { data, error } = await db.rpc("cast_vote", {
          p_visit_id: visitId,
          p_vote: value
        });

        if (error) {
          console.error("Vote failed:", error.message);
          return;
        }

        showTotal(data);
      }

      document.addEventListener("keydown", event => {
        if (
          event.repeat ||
          event.ctrlKey ||
          event.metaKey ||
          event.altKey
        ) return;

        if (event.key.toLowerCase() === "f") {
          castVote(1);
        } else if (event.key.toLowerCase() === "a") {
          castVote(-1);
        }
      });

      try {
        await loadCurrentState();
    } catch (error) {
  counterElement.textContent =
    "Database error: " + (error.message || String(error));

  console.error("Could not load counter or background:", error);
}
      }

      db.channel("counter-live")
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "counter_state",
          filter: "id=eq.1"
        }, payload => {
          if (payload.new && payload.new.respect !== undefined) {
            showTotal(payload.new.respect);
          }
        })
        .subscribe();

      db.channel("background-live")
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "site_settings",
          filter: "id=eq.1"
        }, payload => {
          if (payload.new) {
            applyBackground(payload.new.background_url);
          }
        })
        .subscribe();
    }

    if (
      window.supabase &&
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("YOUR_SUPABASE") &&
      !SUPABASE_KEY.includes("YOUR_SUPABASE")
    ) {
      startApp();
    } else {
      counterElement.textContent = "Setup required";
      console.error("Add your Supabase URL and publishable key.");
    }
  </script>
</body>
</html>
