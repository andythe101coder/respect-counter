
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respect Counter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #222;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* Background picture */
    #picture {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: -1;
    }

    /* Upload button */
    #upload {
        position: absolute;
        top: 20px;
        left: 20px;
        max-width: calc(100vw - 40px);
        padding: 10px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        border-radius: 8px;
    }

    /* Respect counter */
    #counter {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 14px 22px;
        background: rgba(0, 0, 0, 0.8);
        border: 2px solid white;
        border-radius: 10px;
        font-size: 26px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
    }

    /* Floating text */
    .popup {
        position: absolute;
        left: 50%;
        top: 55%;
        transform: translate(-50%, 0);
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 32px;
        font-weight: 900;
        white-space: nowrap;
        pointer-events: none;
        animation: floatUp 1.2s ease-out forwards;
        text-shadow: 2px 2px 4px black;
    }

    .positive {
        color: #45ff70;
        background: rgba(0, 100, 25, 0.85);
        border: 2px solid #45ff70;
    }

    .negative {
        color: #ff4545;
        background: rgba(120, 0, 0, 0.85);
        border: 2px solid #ff4545;
    }

    @keyframes floatUp {
        0% {
            opacity: 0;
            transform: translate(-50%, 20px) scale(0.8);
        }
        15% {
            opacity: 1;
            transform: translate(-50%, 0) scale(1.1);
        }
        30% {
            transform: translate(-50%, -10px) scale(1);
        }
        100% {
            opacity: 0;
            transform: translate(-50%, -150px) scale(0.95);
        }
    }

    /* Instructions */
    #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 18px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.75);
        text-align: center;
        font-size: 16px;
        width: max-content;
        max-width: 95%;
    }
</style>
</head>

<body>

<img id="picture" alt="Your background picture">

<input type="file" id="upload" accept="image/*">

<div id="counter">Respect: <span id="respect">0</span></div>

<div id="instructions">
    Press <b>F</b> to gain respect &nbsp; | &nbsp;
    Press <b>A</b> to lose respect
</div>

<script>
    let respect = 0;

    const respectDisplay = document.getElementById("respect");
    const picture = document.getElementById("picture");
    const upload = document.getElementById("upload");

    // Load your own picture
    upload.addEventListener("change", function () {
        const file = this.files[0];

        if (file) {
            picture.src = URL.createObjectURL(file);
        }
    });

    // Show a floating respect message
    function showPopup(amount) {
        const popup = document.createElement("div");

        if (amount > 0) {
            popup.textContent = "+1 Respect";
            popup.className = "popup positive";
        } else {
            popup.textContent = "-1 Respect";
            popup.className = "popup negative";
        }

        // Slightly randomize the horizontal position
        popup.style.left = (40 + Math.random() * 20) + "%";

        document.body.appendChild(popup);

        // Remove the message after its animation
        popup.addEventListener("animationend", function () {
            popup.remove();
        });
    }

    // Keyboard controls
    document.addEventListener("keydown", function (event) {
        // Ignore repeated key events when a key is held down
        if (event.repeat) return;

        // F = +1 Respect
        if (event.key.toLowerCase() === "f") {
            respect++;
            respectDisplay.textContent = respect;
            showPopup(1);
        }

        // A = -1 Respect
        if (event.key.toLowerCase() === "a") {
            respect--;
            respectDisplay.textContent = respect;
            showPopup(-1);
        }
    });
</script>

</body>
</html>
